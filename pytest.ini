[pytest]
; P2 任务 4 新增：冒烟测试标记注册与默认排除
; - tests/test_smoke.py 访问真实 AKShare 数据源（经 SQLite 缓存与降级逻辑），耗时较长，
;   日常全量单测默认跳过，保持离线快速；
; - 显式运行冒烟：python -m pytest -m smoke -v
;   （命令行 -m 会覆盖本文件 addopts 中的默认排除，pytest 既定行为）
testpaths = tests
addopts = -m "not smoke"
markers =
    smoke: P1+P2 主链路冒烟测试（串连数据拉取/因子计算/市场判定/选股输出，访问真实数据源）
